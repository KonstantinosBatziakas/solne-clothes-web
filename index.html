<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#222222">
<title>SOLNE | Streetwear from Greece</title>
<meta name="description" content="Solne Clothes: streetwear created in Greece (Athens). Tees, jerseys and hoodies with graffiti and skull prints.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#222;--mute:#767676;--line:#e6e6e6;--soft:#f4f4f4;--sun:#e8b923;--font:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;min-width:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:400 14px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none;padding:0}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px;height:68px;gap:12px}
.nav{display:flex;gap:26px;height:100%;align-items:stretch}
.nav>li{position:relative;display:flex;align-items:center}
.nav a,.nav>li>button{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.nav>li:hover>a,.nav>li:hover>button{color:var(--mute)}
.dd{position:absolute;top:100%;left:-16px;background:var(--bg);border:1px solid var(--line);min-width:200px;padding:10px 0;display:none}
.nav>li:hover .dd,.nav>li:focus-within .dd{display:block}
.dd button{display:block;width:100%;text-align:left;padding:8px 18px;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.dd button:hover{background:var(--soft)}
.logo{font-weight:800;font-size:28px;letter-spacing:.34em;padding-left:.34em;display:flex;align-items:center;justify-content:center}
.logo img{width:auto;height:38px;object-fit:contain}
.right{justify-self:end;display:flex;gap:16px;align-items:center;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.lang{display:inline-flex;align-items:center;gap:4px}
.lang button{opacity:.45;padding:4px 3px;min-height:36px}
.lang button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:4px}
#cartOpen{min-height:36px;padding:4px 2px}
.burger{display:none;font-size:22px;min-width:40px;min-height:40px;align-items:center;justify-content:center;justify-self:start}
/* slideshow */
.show{position:relative;height:min(82vh,760px);background:var(--soft);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),transparent 45%)}
.cap{position:absolute;z-index:2;left:50%;bottom:54px;transform:translateX(-50%);color:#fff;font-weight:800;font-size:clamp(22px,3.4vw,40px);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;border-bottom:2px solid #fff;padding-bottom:4px;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.ctl{position:absolute;z-index:3;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;color:#fff;font-size:13px}
.ctl button{color:#fff;padding:6px 12px;font-weight:600;min-height:36px}
.arr{position:absolute;z-index:3;top:50%;transform:translateY(-50%);color:#fff;font-size:34px;width:48px;height:64px}
.arr.l{left:8px}.arr.r{right:8px}
/* tiles */
.wrap{padding:56px 28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.sec-h h2{font-weight:800;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.sec-h span{color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{position:relative;aspect-ratio:3/4;background:var(--soft);overflow:hidden;text-align:left;display:block;width:100%}
.tile img{transition:transform .6s}
.tile:hover img{transform:scale(1.04)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 50%)}
.tile div{position:absolute;z-index:2;left:18px;right:18px;bottom:16px;color:#fff}
.tile b{display:block;font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.tile small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.tile u{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
/* products */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 16px}
.card{text-align:left;width:100%}
.ph{position:relative;aspect-ratio:4/5;background:var(--soft);overflow:hidden}
.ph img{position:absolute;inset:0;transition:opacity .35s}
.ph img+img{opacity:0}
.card:hover .ph img+img{opacity:1}
.tag{position:absolute;top:10px;left:10px;z-index:2;background:var(--bg);font-size:11px;font-weight:700;padding:3px 9px;letter-spacing:.06em;text-transform:uppercase}
.card h3{font-weight:600;font-size:13px;letter-spacing:.05em;margin-top:12px;text-transform:uppercase;overflow-wrap:anywhere}
.card p{color:var(--mute)}
.card small{color:var(--mute);font-size:12px}
/* about */
.story{display:grid;grid-template-columns:1fr;background:var(--soft)}
.story article{padding:64px 48px;max-width:640px}
.story h2{font-weight:800;font-size:30px;line-height:1.15;margin-bottom:16px}
.story p{color:var(--mute);margin-bottom:12px}
/* footer */
footer{background:#222;color:#d9d9d9;padding:56px 28px calc(28px + env(safe-area-inset-bottom,0px))}
.fcols{display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
footer h4{color:#fff;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
footer li{margin-bottom:8px}
footer a:hover,footer li button:hover{color:#fff;text-decoration:underline}
footer li button{padding:4px 0;text-align:left;font:inherit;color:inherit;overflow-wrap:anywhere;line-height:1.45}
footer form{display:flex;margin-top:10px;gap:8px;flex-wrap:wrap}
footer input{flex:1 1 100%;width:100%;min-width:0;border:1px solid #666;background:transparent;color:#fff;padding:11px 12px;font:inherit}
footer form button{background:#fff;color:#222;padding:0 18px;font-weight:700;min-height:44px;width:100%}
.nl-status{margin-top:8px;font-size:12px;color:#e8b923;overflow-wrap:anywhere}
.nl-status.err{color:#ff8a80}
.copy{margin-top:40px;padding-top:18px;border-top:1px solid #444;font-size:12px;color:#999}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.ov.open{display:block}
.modal{position:fixed;z-index:41;inset:4vh 6vw;background:var(--bg);display:none;grid-template-columns:1.15fr 1fr;overflow:auto}
.modal.open{display:grid}
.info-modal{position:fixed;z-index:43;inset:8vh 12vw;max-width:720px;margin:0 auto;background:var(--bg);display:none;overflow:auto;padding:40px 36px;border:1px solid var(--line)}
.info-modal.open{display:block}
.info-modal h2{font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px;padding-right:44px}
.info-modal p{color:var(--mute);margin-bottom:14px}
.info-modal ul{margin:10px 0 18px 18px;list-style:disc;color:var(--mute)}
.info-modal li{margin-bottom:6px}
.gal{background:var(--soft);display:grid;grid-template-columns:1fr 1fr;gap:2px;align-content:start}
.gal div{aspect-ratio:4/5}
.gal div:first-child{grid-column:1/3;aspect-ratio:1/1}
.info{padding:36px 34px;align-self:start}
.info h2{font-weight:800;font-size:26px;line-height:1.15;letter-spacing:.04em;text-transform:uppercase}
.info .pr{font-size:20px;margin:10px 0 18px}
.info p{color:var(--mute);margin-bottom:18px}
.sizes{display:flex;gap:8px;margin:8px 0 22px;flex-wrap:wrap}
.sizes button{border:1px solid var(--line);min-width:48px;padding:10px 0;font-weight:600}
.sizes button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.add{width:100%;background:var(--ink);color:#fff;padding:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.add:hover{background:var(--sun);color:#222}
.x{position:absolute;top:10px;right:16px;z-index:3;font-size:30px;line-height:1;background:var(--bg);width:40px;height:40px;border-radius:50%}
.drawer{position:fixed;z-index:42;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--bg);transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;padding:22px}
.drawer.open{transform:none}
.drawer h2{font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.lines{flex:1;overflow:auto}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line .ph{aspect-ratio:4/5}
.line small{color:var(--mute)}
.line button{color:var(--mute);font-size:12px;text-decoration:underline}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:16px 0}
.empty{color:var(--mute);padding:30px 0}
.cookie{position:fixed;z-index:50;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;background:#222;color:#eee;padding:14px 16px;display:flex;gap:14px;align-items:center;font-size:13px;flex-wrap:wrap}
.cookie button{background:#fff;color:#222;padding:8px 16px;font-weight:700;white-space:nowrap;min-height:38px}

@media (max-width:900px){
 header{padding:0 12px;height:60px;grid-template-columns:40px 1fr auto;gap:8px}
 .burger{display:flex}
 .nav{display:none;position:fixed;top:60px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;gap:0;padding:12px 16px;height:auto;z-index:35;max-height:calc(100vh - 60px);overflow-y:auto}
 .nav.open{display:flex}
 .nav>li{display:block;padding:8px 0}
 .nav>li>a,.nav>li>button{display:block;padding:6px 0}
 .dd{position:static;display:block;border:0;padding:4px 0 0 12px;min-width:0}
 .logo{justify-self:center;padding-left:0;letter-spacing:.22em;font-size:22px}
 .logo img{height:28px}
 .right{gap:10px;font-size:12px;letter-spacing:.04em}
 .show{height:min(68vh,560px)}
 .tiles,.grid{grid-template-columns:repeat(2,1fr)}
 .story article{padding:40px 20px}
 .fcols{grid-template-columns:repeat(2,1fr);gap:24px 18px}
 .wrap{padding:40px 16px}
 footer{padding:44px 16px calc(28px + env(safe-area-inset-bottom,0px))}
 .modal{grid-template-columns:1fr;inset:0}
 .info{padding:24px 18px}
 .info-modal{inset:4vh 4vw;padding:28px 20px}
 .cap{font-size:18px;bottom:56px}
}

@media (max-width:520px){
 header{padding:0 10px;grid-template-columns:36px minmax(0,1fr) auto;gap:6px}
 .logo img{height:24px}
 .right{gap:8px;font-size:11px;letter-spacing:.02em}
 .lang{gap:2px}
 .lang button{padding:4px 2px}
 .fcols{grid-template-columns:1fr;gap:28px}
 .arr{width:40px;height:52px;font-size:28px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}

.cartnote{font-size:12px;color:var(--mute);margin:0 0 10px}
.ordform{display:grid;gap:14px;margin-top:16px}
.ordform label{display:grid;gap:6px;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.ordform input,.ordform select,.ordform textarea,.ordtxt{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:11px 12px;font:inherit;text-transform:none;letter-spacing:0;font-weight:400;border-radius:0}
.ordtxt{margin:6px 0 14px;resize:none}
.ordbtn{display:block;text-align:center;margin-top:10px}
.ordbtn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.ordst{color:var(--mute);margin-top:12px;font-size:12px}
.add:disabled:hover{background:var(--ink);color:#fff}
</style>
</head>

<div class="ov" id="ov"></div>

/* newsletter client module (Cloudflare Workers + KV + Resend) */
var SolneNewsletter = {
  storageKey: "solne-nl-queue",
  readQueue: function(){
    try{var raw=localStorage.getItem(this.storageKey);return raw?JSON.parse(raw):[]}catch(e){return[]}
  },
  writeQueue: function(q){
    try{localStorage.setItem(this.storageKey,JSON.stringify(q))}catch(e){}
  },
  subscribe: function(email, lang){
    var norm = String(email || "").trim().toLowerCase();
    var payload = {
      email: norm,
      lang: lang,
      brand: "Solne Clothes",
      studio: "334 Creations Studio",
      sender: SOLNE_SENDER_EMAIL,
      created_at: new Date().toISOString()
    };
    if(!SOLNE_NEWSLETTER_ENDPOINT){
      var q = this.readQueue();
      if(q.some(function(item){return item.email === norm})){
        return Promise.resolve({ok:true, duplicate:true, queued:true});
      }
      q.push(payload);
      this.writeQueue(q);
      return Promise.resolve({ok:true, duplicate:false, queued:true});
    }
    return fetch(SOLNE_NEWSLETTER_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    }).then(function(res){
      if(res.status === 409) return {ok:true, duplicate:true, queued:false};
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json().catch(function(){return {ok:true}});
    });
  }
};

    st.textContent = res.duplicate ? t("nlDup") : t("nlOk");
    inp.value = "";
  }).catch(function(err){
    st.className = "nl-status err";
    st.textContent = t("nlErr") + (err && err.message ? " (" + err.message + ")" : "");
  });
};
